[project]
name = "traveloop-chatbot"
version = "1.0.0"
description = "AI-powered travel planning assistant using LangChain"
authors = [
    {name = "Traveloop Team", email = "team@traveloop.com"}
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langchain>=0.1.0",
    "langchain-groq>=0.0.5",
    "langchain-community>=0.0.10",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
